<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>orchestra — agentic knowledge assistant</title>
<style>
  :root {
    --bg: #0e1116; --panel: #171b22; --panel2: #1f2530; --border: #2a313c;
    --text: #e6e9ef; --muted: #9aa4b2; --accent: #6ea8fe; --accent2: #7ee787;
    --warn: #f0b429; --action: #ff7b72; --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex;
    align-items: center; gap: 14px; background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .3px; }
  header h1 span { color: var(--accent); }
  .pill { font-size: 12px; color: var(--muted); background: var(--panel2);
    border: 1px solid var(--border); padding: 3px 9px; border-radius: 999px; }
  .pill b { color: var(--accent2); font-weight: 600; }
  main { flex: 1; overflow-y: auto; padding: 22px; max-width: 860px; width: 100%; margin: 0 auto; }
  .msg { margin-bottom: 18px; }
  .msg .role { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 4px; }
  .bubble { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 15px; white-space: pre-wrap; }
  .msg.user .bubble { background: var(--panel2); border-color: #324; }
  .trace { margin: 8px 0 0; padding-left: 0; list-style: none; }
  .ev { font-size: 13px; border-left: 2px solid var(--border); padding: 6px 12px; margin: 5px 0;
    color: var(--muted); background: rgba(255,255,255,.015); border-radius: 0 8px 8px 0; }
  .ev.tool { border-left-color: var(--accent); }
  .ev.action { border-left-color: var(--action); }
  .ev.skill { border-left-color: var(--accent2); }
  .ev.result { border-left-color: #5a6472; }
  .ev code { color: var(--accent); background: rgba(110,168,254,.1); padding: 1px 5px; border-radius: 5px; }
  .ev pre { margin: 6px 0 0; white-space: pre-wrap; color: #c4ccd8; font-size: 12.5px; max-height: 180px; overflow:auto; }
  .approve { margin-top: 10px; }
  .approve button { background: var(--warn); color: #1a1206; border: 0; padding: 8px 16px;
    border-radius: 8px; font-weight: 600; cursor: pointer; }
  footer { border-top: 1px solid var(--border); padding: 14px 20px; background: var(--panel); }
  .composer { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  textarea { flex: 1; resize: none; height: 46px; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; }
  .send { background: var(--accent); color: #08111f; border: 0; padding: 0 20px; height: 46px;
    border-radius: 10px; font-weight: 600; cursor: pointer; }
  .send:disabled { opacity: .5; cursor: default; }
  label.toggle { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .examples { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .examples a { color: var(--accent); cursor: pointer; text-decoration: none; margin-right: 12px; }
</style>
</head>
<body>
<header>
  <h1><span>orchestra</span> · agentic knowledge assistant</h1>
  <span class="pill" id="provider">provider: …</span>
  <span class="pill" id="kb">kb: …</span>
  <span class="pill" id="tools">tools: …</span>
</header>

<main id="log">
  <div class="examples">
    Try:
    <a data-q="How does MCP solve the N x M integration problem?">MCP &amp; N×M</a>
    <a data-q="Explain progressive disclosure in Agent Skills.">progressive disclosure</a>
    <a data-q="What share of an agent is the harness vs the model?">harness vs model</a>
    <a data-q="Save this: A2UI is sheet music for UI.">save a note (HITL)</a>
  </div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" placeholder="Ask about MCP, RAG, Agent Skills, harnesses…  (Enter to send)"></textarea>
    <label class="toggle"><input type="checkbox" id="auto" /> auto-approve actions</label>
    <button class="send" id="send">Send</button>
  </div>
</footer>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const autoBox = document.getElementById('auto');

async function refreshHealth() {
  try {
    const h = await (await fetch('/health')).json();
    document.getElementById('provider').innerHTML = 'provider: <b>' + h.llm_provider + '</b>';
    document.getElementById('kb').innerHTML = 'kb: <b>' + h.kb_vectors + '</b> vectors';
    document.getElementById('tools').innerHTML = 'tools: <b>' + (h.mcp_tools||[]).length + '</b>';
  } catch (e) {}
}
refreshHealth();

function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
function addUser(text) {
  log.appendChild(el(`<div class="msg user"><div class="role">you</div><div class="bubble"></div></div>`));
  log.lastChild.querySelector('.bubble').textContent = text;
  log.scrollTop = log.scrollHeight;
}
function addAssistant() {
  const node = el(`<div class="msg agent"><div class="role">orchestra</div><ul class="trace"></ul><div class="bubble" style="display:none"></div></div>`);
  log.appendChild(node); log.scrollTop = log.scrollHeight; return node;
}
function esc(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function ask(message) {
  addUser(message);
  const node = addAssistant();
  const trace = node.querySelector('.trace');
  const bubble = node.querySelector('.bubble');
  sendBtn.disabled = true;

  const url = `/chat/stream?message=${encodeURIComponent(message)}&auto_approve=${autoBox.checked}`;
  const es = new EventSource(url);

  const addEv = (cls, html) => { const li = el(`<li class="ev ${cls}">${html}</li>`); trace.appendChild(li); log.scrollTop = log.scrollHeight; };

  es.addEventListener('step', e => {
    const d = JSON.parse(e.data);
    addEv('', `harness ready · provider <code>${d.provider}</code> · ${d.tools} tools advertised`);
  });
  es.addEventListener('tool_call', e => {
    const d = JSON.parse(e.data);
    addEv(d.is_action ? 'action' : 'tool',
      `${d.is_action ? '⚠ action' : '→ calling'} <code>${esc(d.name)}</code> ${esc(JSON.stringify(d.arguments))}`);
  });
  es.addEventListener('skill_loaded', e => {
    const d = JSON.parse(e.data);
    addEv('skill', `📘 loaded skill <code>${esc(d.name)}</code> (progressive disclosure)`);
  });
  es.addEventListener('tool_result', e => {
    const d = JSON.parse(e.data);
    addEv('result', `← <code>${esc(d.name)}</code> returned:<pre>${esc(d.content)}</pre>`);
  });
  es.addEventListener('approval_required', e => {
    const d = JSON.parse(e.data);
    addEv('action', `⚠ <b>human approval required</b> for <code>${esc(d.name)}</code> ${esc(JSON.stringify(d.arguments))}`);
  });
  es.addEventListener('answer', e => {
    const d = JSON.parse(e.data);
    bubble.style.display = 'block'; bubble.textContent = d.text;
    if (d.pending_approval) {
      const box = el(`<div class="approve"><button>Approve &amp; run action</button></div>`);
      box.querySelector('button').onclick = () => { autoBox.checked = true; box.remove(); ask(message); };
      bubble.appendChild(box);
    }
    es.close(); sendBtn.disabled = false;
  });
  es.onerror = () => { addEv('', '⚠ stream error'); es.close(); sendBtn.disabled = false; };
}

function submit() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  ask(text);
}
sendBtn.onclick = submit;
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });
document.querySelectorAll('.examples a').forEach(a => a.onclick = () => { input.value = a.dataset.q; submit(); });
</script>
</body>
</html>
